plugins {
    id 'com.android.application'
}

def projectRoot = file('../..')
def versionHeader = new File(projectRoot, 'src/version.h').text
def versionComponent = { String name ->
    def matches = (versionHeader =~ /(?m)^#define\s+SUDOKURA_VERSION_${name}\s+(\d+)\s*$/)
    def values = matches.collect { it[1] }
    if (values.size() != 1) {
        throw new GradleException("Missing or ambiguous version component ${name}")
    }
    return Long.parseLong(values[0])
}

def major = versionComponent('MAJOR')
def minor = versionComponent('MINOR')
def patch = versionComponent('PATCH')
if (minor > 99 || patch > 99) {
    throw new GradleException('versionCode requires two-digit minor/patch')
}
def androidCode = major * 10000L + minor * 100L + patch
if (androidCode <= 0 || androidCode > Integer.MAX_VALUE) {
    throw new GradleException('versionCode must fit a positive signed 32-bit integer')
}

android {
    namespace 'org.sudokura.prototype'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.cajapersonal.sudokura'
        minSdk 28
        targetSdk 36
        versionCode (int) androidCode
        versionName "${major}.${minor}.${patch}"
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    flavorDimensions 'distribution'
    productFlavors {
        prototype {
            dimension 'distribution'
            applicationId 'org.sudokura.prototype.debug'
            versionNameSuffix '-prototype'
        }
        production {
            dimension 'distribution'
        }
    }

    buildTypes {
        release {
            signingConfig = null
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDir "${projectRoot}/android/.cache/source/SDL2-2.32.10/android-project/app/src/main/java"
            assets.srcDir "${buildDir}/generated/sudokura-assets"
            res.srcDir "${buildDir}/generated/sudokura-icons"
        }
    }
}

tasks.register('prepareSudokuraAssets', Copy) {
    def fontPath = providers.gradleProperty('sudokuraFont')
    doFirst {
        if (!fontPath.present || !file(fontPath.get()).isFile()) {
            throw new GradleException('Specify -PsudokuraFont=/verified/path/DejaVuSans.ttf')
        }
        def license = providers.gradleProperty('sudokuraFontLicense')
        if (!license.present || !file(license.get()).isFile()) {
            throw new GradleException('Specify -PsudokuraFontLicense=/verified/path/font-copyright')
        }
    }
    from(projectRoot) {
        include 'assets/audio/*.ogg'
        eachFile { details ->
            details.path = details.path.replace('assets/', '')
        }
        includeEmptyDirs = false
    }
    from(fontPath.map { file(it) }) {
        rename { 'DejaVuSans.ttf' }
    }
    from(providers.gradleProperty('sudokuraFontLicense').map { file(it) }) {
        into 'licenses'
        rename { 'DejaVuSans-copyright.txt' }
    }
    from(new File(projectRoot, 'LICENSE')) {
        into 'licenses'
        rename { 'Sudokura-GPLv3.txt' }
    }
    from(new File(projectRoot, 'assets/audio/README.md')) {
        into 'audio'
    }
    [
        'SDL2-2.32.10',
        'SDL2_ttf-2.24.0',
        'SDL2_mixer-2.8.1'
    ].each { source ->
        from(new File(projectRoot, "android/.cache/source/${source}/LICENSE.txt")) {
            into 'licenses'
            rename { "${source}-license.txt" }
        }
    }
    from(new File(projectRoot, 'android/.cache/source/SDL2_ttf-2.24.0/external/freetype/LICENSE.TXT')) {
        into 'licenses'
        rename { 'FreeType-license-choice.txt' }
    }
    from(new File(projectRoot, 'android/.cache/source/SDL2_ttf-2.24.0/external/freetype/docs/FTL.TXT')) {
        into 'licenses'
        rename { 'FreeType-FTL.txt' }
    }
    into "${buildDir}/generated/sudokura-assets"
}
// Generated-only resource: reuse the canonical 512px project icon, never a
// second independently edited Android logo master.
tasks.register('prepareSudokuraIcon', Copy) {
    from(new File(projectRoot, 'assets/branding/source/sudokura-512.png')) {
        into 'drawable-nodpi'
        rename { 'sudokura_icon_source.png' }
    }
    into "${buildDir}/generated/sudokura-icons"
}
tasks.named('preBuild') {
    dependsOn tasks.named('prepareSudokuraAssets'),
              tasks.named('prepareSudokuraIcon')
}

// Keep the existing prototype and the unsigned production candidate separate.
// No production debug package or prototype release is a distribution channel.
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.name in ['prototypeDebug', 'productionRelease']
    }
}
