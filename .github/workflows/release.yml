name: Package Sudokura release

on:
  workflow_dispatch:
    inputs:
      approved_source_sha:
        description: Exact approved release/1.4.1 HEAD SHA (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

env:
  PACKAGE_REF: ${{ github.sha }}
  SUDOKURA_ARTIFACT_KIND: preview

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PACKAGE_REF }}
          fetch-depth: 0
      - name: Require exact approved release branch HEAD
        env:
          APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = santirodriguez
          test "$GITHUB_REF" = refs/heads/release/1.4.1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$APPROVED_SOURCE_SHA"
          test "$(sh scripts/version.sh)" = 1.4.1
      - id: version
        run: |
          echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'package_ref=%s\nsource_commit=%s\nsource_version=%s\n' "$PACKAGE_REF" "$(git rev-parse HEAD)" "$(./scripts/version.sh)"

  android:
    needs: version
    uses: ./.github/workflows/android-preview.yml
    with:
      source_commit: ${{ needs.version.outputs.commit }}

  # This job is manual-only; only its signing step references the existing repository secrets.
  android-sign:
    needs: [version, android]
    if: github.event_name == 'workflow_dispatch' && github.actor == 'santirodriguez'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
      SUDOKURA_APPROVED_SOURCE_SHA: ${{ inputs.approved_source_sha }}
      REQUIRE_SIGNED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sudokura-android-unsigned-production
          path: android-production-output
      - name: Verify approved source and downloaded unsigned inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_signing_context.py
          python3 android/scripts/signing_context.py
          test "$(git rev-parse HEAD)" = "$SUDOKURA_SOURCE_COMMIT"
          python3 android/scripts/verify_signing_input.py \
            --directory android-production-output \
            --source-commit "$SUDOKURA_SOURCE_COMMIT" \
            --version "$(sh scripts/version.sh)"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned signing and auditing tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - name: Sign production APK with the original Sudokura app key
        shell: bash
        env:
          SUDOKURA_APP_KEYSTORE_BASE64: ${{ secrets.SUDOKURA_APP_KEYSTORE_BASE64 }}
          SUDOKURA_APP_KEYSTORE_PASSWORD: ${{ secrets.SUDOKURA_APP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SUDOKURA_APP_KEYSTORE_BASE64:?Missing repository secret SUDOKURA_APP_KEYSTORE_BASE64}"
          : "${SUDOKURA_APP_KEYSTORE_PASSWORD:?Missing repository secret SUDOKURA_APP_KEYSTORE_PASSWORD}"
          VERSION=$(sh scripts/version.sh)
          APK="android-production-output/Sudokura-$VERSION-Android-arm64-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/sudokura-release.jks"
          SIGNED=android-production-output/Sudokura-$(sh scripts/version.sh)-Android-arm64.apk
          trap 'rm -f "$KEYSTORE"' EXIT
          python3 - "$KEYSTORE" <<'PYKEY'
          import base64
          import os
          import sys
          from pathlib import Path
          data = base64.b64decode(os.environ['SUDOKURA_APP_KEYSTORE_BASE64'], validate=True)
          if not data:
              raise SystemExit('Decoded signing keystore is empty')
          path = Path(sys.argv[1])
          path.write_bytes(data)
          path.chmod(0o600)
          PYKEY
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-type JKS \
            --ks-key-alias sudokura \
            --ks-pass env:SUDOKURA_APP_KEYSTORE_PASSWORD \
            --key-pass env:SUDOKURA_APP_KEYSTORE_PASSWORD \
            --out "$SIGNED" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee android-production-output/apk-signature.txt
          grep -Eqi 'fde951e3d2ef42e41c7186ee965944aeca549d590ad080711dd3d875f82df66d' android-production-output/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$SIGNED" > android-production-output/signed-zipalign.txt
          python3 android/scripts/audit_apk.py "$ANDROID_HOME/build-tools/35.0.0/aapt" "$SIGNED" --variant release > android-production-output/signed-apk-audit.json
          sha256sum "$SIGNED" > android-production-output/signed-SHA256SUMS.txt
          printf 'signing=PASS\nsigning_alias=sudokura\nsigning_certificate_sha256=FDE951E3D2EF42E41C7186EE965944AECA549D590AD080711DD3D875F82DF66D\n' >> android-production-output/build-info.txt
          mkdir -p android-signed-output
          cp "$SIGNED" android-signed-output/
          cp android-production-output/signed-apk-audit.json android-production-output/signed-SHA256SUMS.txt android-production-output/apk-signature.txt android-production-output/signed-zipalign.txt android-signed-output/
          python3 android/scripts/release_manifest.py \
            --directory android-signed-output --version "$(sh scripts/version.sh)" \
            --source-commit "$SUDOKURA_SOURCE_COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sudokura-android-signed-github
          path: android-signed-output/
          retention-days: 7
          if-no-files-found: error

  linux:
    needs: version
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential binutils file desktop-file-utils pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libdecor-0-plugin-1-cairo libfuse2 curl fonts-dejavu-core
      - run: make assets && make WERROR=-Werror test test-ui all
      - run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software SDL_RENDER_VSYNC=0 ./sudokura --render-screenshots ui-review
      - name: Validate screenshot matrix and validator regressions
        shell: bash
        run: |
          ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
          python3 tests/test_screenshot_validator.py ui-review
      - run: ./scripts/fetch_appimage_toolchain.sh
      - run: |
          LINUXDEPLOY=$PWD/linuxdeploy \
          APPIMAGETOOL=$PWD/appimagetool \
          APPIMAGE_RUNTIME=$PWD/appimage-runtime \
          packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64
          path: |
            Sudokura-*-Linux-x64.AppImage
            SHA256SUMS-linux.txt
            inventory-linux.txt
            dependencies-linux-all.txt
            external-dependencies-linux.txt
            abi-linux.txt
            components-linux.txt
            artifact-manifest-linux.json
            build-provenance-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-review-screenshots
          path: ui-review
          compression-level: 9

  linux-ubuntu24:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: candidate
      - name: Install Ubuntu runtime validation dependencies
        run: |
          # Bound external apt/mirror stalls instead of trapping the entire CI.
          sudo timeout --signal=TERM --kill-after=10s 180s \
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
          # Weston has a large optional multimedia/VA/remote-desktop
          # dependency graph on Ubuntu 24.04. The runtime probe uses its
          # X11 backend and does not require those recommended add-ons.
          sudo timeout --signal=TERM --kill-after=10s 480s \
            env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends \
              binutils libfuse2t64 xvfb weston dbus-x11 gdb strace
      - run: chmod +x candidate/Sudokura-*-Linux-x64.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*-Linux-x64.AppImage ubuntu24 required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: linux-ubuntu24-runtime
          path: linux-runtime-ubuntu24.txt

  linux-fedora44:
    needs: [version, linux]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y install git findutils coreutils binutils fuse-libs xorg-x11-server-Xvfb weston dbus-daemon gdb strace
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: candidate
      - run: chmod +x candidate/Sudokura-*-Linux-x64.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*-Linux-x64.AppImage fedora44 skip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: linux-fedora44-runtime
          path: linux-runtime-fedora44.txt

  windows:
    needs: version
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Expose setup-go executable to MSYS2
        shell: pwsh
        run: |
          $go = (Get-Command go -ErrorAction Stop).Source
          "SUDOKURA_GO=$go" >> $env:GITHUB_ENV
          & $go version
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-ttf-dejavu
            make zip unzip
      - name: Fetch pinned Inno Setup
        shell: pwsh
        run: ./scripts/fetch_innosetup.ps1
      - name: Fetch pinned NSIS
        shell: pwsh
        run: ./scripts/fetch_nsis.ps1
      - run: packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x86_64
          path: |
            Sudokura-*-Windows-x64-Internal.zip
            Sudokura-*-Windows-x64-Portable.exe
            SHA256SUMS-windows.txt
            internal-zip-sha256-windows.txt
            inventory-windows.txt
            dependencies-windows.txt
            dependencies-windows-recursive.txt
            Sudokura-*-Windows-x64-Setup.exe
            artifact-manifest-windows.json
            build-provenance-windows.txt
            portable-benchmark-windows.txt
            components-windows.txt

  macos:
    needs: version
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.version.outputs.commit }}
      ARCH: arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf sdl2_mixer pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64
          path: |
            Sudokura-*-macOS-arm64.dmg
            SHA256SUMS-macos-arm64.txt
            inventory-macos-arm64.txt
            dependencies-macos-arm64.txt
            architecture-macos-arm64.txt
            codesign-macos-arm64.txt
            components-macos-arm64.txt
            mach-o-audit-macos-arm64.json
            smoke-macos-arm64-*.txt
            dmg-verify-macos-arm64.txt
            size-comparison-macos-arm64.txt
            artifact-manifest-macos-arm64.json
            build-provenance-macos-arm64.txt

  release-bundle:
    needs: [version, linux, linux-ubuntu24, linux-fedora44, windows, macos, android-sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate public release bundle
        run: |
          python3 scripts/release_bundle.py build \
            --artifacts-dir artifacts \
            --version "${{ needs.version.outputs.version }}" \
            --source-commit "${{ needs.version.outputs.commit }}" --include-android
          cat artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: |
            artifacts/Sudokura-*-Windows-x64-Setup.exe
            artifacts/Sudokura-*-Windows-x64-Portable.exe
            artifacts/Sudokura-*-Linux-x64.AppImage
            artifacts/Sudokura-*-macOS-arm64.dmg
            artifacts/Sudokura-*-Android-arm64.apk
            artifacts/SHA256SUMS.txt
            artifacts/Sudokura-*-Build-Info.json
            artifacts/artifact-manifest-*.json
            artifacts/build-provenance-*.txt
