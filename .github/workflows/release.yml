name: Package Sudokura v1.1.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.*'

permissions:
  contents: write

env:
  VERSION: '1.1.0'

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libfuse2 wget fonts-dejavu-core
      - run: make assets && make WERROR=-Werror test test-ui all
      - run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software SDL_RENDER_VSYNC=0 ./sudokura --render-screenshots ui-review
      - run: ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
      - run: wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy && chmod +x linuxdeploy
      - run: VERSION=$VERSION LINUXDEPLOY=$PWD/linuxdeploy packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            Sudokura-*.AppImage
            SHA256SUMS-linux.txt
            inventory-linux.txt
            dependencies-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ui-review-screenshots
          path: ui-review
          compression-level: 9

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Expose setup-go executable to MSYS2
        shell: pwsh
        run: |
          $go = (Get-Command go -ErrorAction Stop).Source
          "SUDOKURA_GO=$go" >> $env:GITHUB_ENV
          & $go version
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-ttf-dejavu
            make zip unzip
      - run: VERSION=$VERSION packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            Sudokura-*.zip
            SHA256SUMS-windows.txt
            inventory-windows.txt
            dependencies-windows.txt

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: VERSION=$VERSION ARCH=${{ matrix.arch }} packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            Sudokura-*.zip
            SHA256SUMS-*.txt
            inventory-macos-*.txt
            dependencies-macos-*.txt
            architecture-macos-*.txt
            smoke-macos-*.txt

  checksums:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true
      - run: cat artifacts/SHA256SUMS-*.txt | sort -k2 > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: artifacts/*
          body_path: docs/RELEASE_NOTES_1.1.0.md
