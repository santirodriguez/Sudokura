name: Preview Sudokura v1.1.0 packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: upgrade/v1.1.0
        type: string

permissions:
  contents: read

env:
  VERSION: '1.1.0'

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libfuse2 wget
      - name: Build and test
        run: make assets && make WERROR=-Werror test all
      - name: Build AppImage
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp sudokura AppDir/usr/bin/
          cp packaging/linux/sudokura.desktop AppDir/usr/share/applications/
          cp assets/generated/sudokura-256.png AppDir/usr/share/icons/hicolor/256x256/apps/sudokura.png
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          ./linuxdeploy --appdir AppDir --output appimage
          mv Sudokura*.AppImage Sudokura-v${VERSION}-linux-x86_64.AppImage
          chmod +x Sudokura-v${VERSION}-linux-x86_64.AppImage
          test -x Sudokura-v${VERSION}-linux-x86_64.AppImage
          file Sudokura-v${VERSION}-linux-x86_64.AppImage
          du -h Sudokura-v${VERSION}-linux-x86_64.AppImage
          sha256sum Sudokura-v${VERSION}-linux-x86_64.AppImage > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            Sudokura-*.AppImage
            SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf mingw-w64-x86_64-ntldd mingw-w64-x86_64-dejavu-fonts make zip
      - name: Build, test, and package
        run: |
          set -euo pipefail
          make assets
          make WERROR=-Werror test
          windres packaging/windows/sudokura.rc -O coff -o icon.o
          gcc -I. -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror sudokura_sdl.c game.c geometry.c i18n.c assets/generated/window_icon.c icon.o -o sudokura.exe $(pkg-config --cflags --libs sdl2 SDL2_ttf) -lm -mwindows
          mkdir dist
          cp sudokura.exe dist/
          cp /mingw64/bin/SDL2.dll /mingw64/bin/SDL2_ttf.dll dist/
          for pass in 1 2 3 4 5; do
            before=$(find dist -type f | wc -l)
            ntldd -R dist/*.exe dist/*.dll | awk '/=> \/mingw64/{print $3}' | sort -u | xargs -r -I{} cp -n {} dist/
            after=$(find dist -type f | wc -l)
            [ "$before" = "$after" ] && break
          done
          cp /mingw64/share/fonts/TTF/DejaVuSans.ttf dist/
          cp /mingw64/share/licenses/dejavu-fonts/LICENSE dist/DejaVu-FONT-LICENSE.txt
          ! ntldd -R dist/*.exe dist/*.dll | grep 'not found'
          test -f dist/sudokura.exe
          test -f dist/SDL2.dll
          test -f dist/SDL2_ttf.dll
          test -f dist/DejaVuSans.ttf
          test -f dist/DejaVu-FONT-LICENSE.txt
          (cd dist && zip -9 ../Sudokura-v${VERSION}-windows-x86_64.zip *)
          unzip -l Sudokura-v${VERSION}-windows-x86_64.zip
          du -h Sudokura-v${VERSION}-windows-x86_64.zip
          sha256sum Sudokura-v${VERSION}-windows-x86_64.zip > SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          path: |
            Sudokura-*.zip
            SHA256SUMS-windows.txt

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Install dependencies
        run: brew install sdl2 sdl2_ttf pkg-config
      - name: Build and test
        run: make assets && make WERROR=-Werror test all
      - name: Build application bundle
        run: |
          set -euo pipefail
          chmod +x packaging/macos/bundle.sh
          curl -L --fail --retry 3 -o DejaVuSans.ttf https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/version_2_37/ttf/DejaVuSans.ttf
          curl -L --fail --retry 3 -o DejaVu-LICENSE https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/version_2_37/LICENSE
          FONT=$PWD/DejaVuSans.ttf FONT_LICENSE=$PWD/DejaVu-LICENSE PREFIX=$(brew --prefix) packaging/macos/bundle.sh Sudokura.app sudokura
          test -x Sudokura.app/Contents/MacOS/sudokura
          test -f Sudokura.app/Contents/Info.plist
          test -f Sudokura.app/Contents/Resources/sudokura.icns
          test -f Sudokura.app/Contents/Resources/DejaVuSans.ttf
          test -f Sudokura.app/Contents/Resources/DejaVu-FONT-LICENSE.txt
          ditto -c -k --sequesterRsrc --keepParent Sudokura.app Sudokura-v${VERSION}-macos-${{ matrix.arch }}-unsigned.zip
          unzip -l Sudokura-v${VERSION}-macos-${{ matrix.arch }}-unsigned.zip
          du -h Sudokura-v${VERSION}-macos-${{ matrix.arch }}-unsigned.zip
          shasum -a 256 Sudokura-v${VERSION}-macos-${{ matrix.arch }}-unsigned.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            Sudokura-*.zip
            SHA256SUMS-*.txt

  checksums:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate checksums and inventory
        run: |
          set -euo pipefail
          find artifacts -maxdepth 2 -type f -print | sort
          cat artifacts/*/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: package-checksums
          if-no-files-found: error
          path: SHA256SUMS.txt
