name: Preview Sudokura packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to package without publishing
        required: true
        default: upgrade/v1.2.0
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'upgrade/v1.2.0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libfuse2 curl fonts-dejavu-core
      - run: make assets && make WERROR=-Werror test test-ui all
      - run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software SDL_RENDER_VSYNC=0 ./sudokura --render-screenshots ui-review
      - run: ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
      - run: ./scripts/fetch_linuxdeploy.sh linuxdeploy
      - run: LINUXDEPLOY=$PWD/linuxdeploy packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            Sudokura-*.AppImage
            SHA256SUMS-linux.txt
            inventory-linux.txt
            dependencies-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ui-review-screenshots
          path: ui-review
          compression-level: 9

  windows:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'upgrade/v1.2.0'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Expose setup-go executable to MSYS2
        shell: pwsh
        run: |
          $go = (Get-Command go -ErrorAction Stop).Source
          "SUDOKURA_GO=$go" >> $env:GITHUB_ENV
          & $go version
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-ttf-dejavu
            make zip unzip
      - run: packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            Sudokura-*.zip
            SHA256SUMS-windows.txt
            inventory-windows.txt
            dependencies-windows.txt
            dependencies-windows-recursive.txt

  macos:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'upgrade/v1.2.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: ARCH=${{ matrix.arch }} packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            Sudokura-*.zip
            SHA256SUMS-*.txt
            inventory-macos-*.txt
            dependencies-macos-*.txt
            architecture-macos-*.txt
            smoke-macos-*.txt

  checksums:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'upgrade/v1.2.0'
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - run: cat artifacts/SHA256SUMS-*.txt | sort -k2 > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: artifacts/SHA256SUMS.txt
