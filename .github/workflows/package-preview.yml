name: Preview Sudokura packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to package without publishing
        required: true
        default: upgrade/v1.3.0
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-preview-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
  SUDOKURA_ARTIFACT_KIND: preview

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PREVIEW_REF }}
          fetch-depth: 0
      - id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(./scripts/version.sh)" >> "$GITHUB_OUTPUT"
          printf 'preview_ref=%s\nsource_commit=%s\nsource_version=%s\n' "$PREVIEW_REF" "$(git rev-parse HEAD)" "$(./scripts/version.sh)"
  linux:
    needs: resolve
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential binutils file desktop-file-utils pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libfuse2 curl fonts-dejavu-core
      - run: make assets && make WERROR=-Werror test test-ui all
      - run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy SDL_RENDER_DRIVER=software SDL_RENDER_VSYNC=0 ./sudokura --render-screenshots ui-review
      - run: ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
      - run: ./scripts/fetch_appimage_toolchain.sh
      - run: |
          LINUXDEPLOY=$PWD/linuxdeploy \
          APPIMAGETOOL=$PWD/appimagetool \
          APPIMAGE_RUNTIME=$PWD/appimage-runtime \
          packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-x86_64
          path: |
            Sudokura-*.AppImage
            SHA256SUMS-linux.txt
            inventory-linux.txt
            dependencies-linux-all.txt
            external-dependencies-linux.txt
            abi-linux.txt
            components-linux.txt
            artifact-manifest-linux.json
            build-provenance-linux.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-review-screenshots
          path: ui-review
          compression-level: 9

  linux-ubuntu24:
    needs: [resolve, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: candidate
      - run: sudo apt-get update && sudo apt-get install -y libfuse2t64 xvfb weston dbus-x11
      - run: chmod +x candidate/Sudokura-*.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*.AppImage ubuntu24 required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-ubuntu24-runtime
          path: linux-runtime-ubuntu24.txt

  linux-fedora44:
    needs: [resolve, linux]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y install git findutils coreutils fuse-libs xorg-x11-server-Xvfb weston dbus-daemon
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-x86_64
          path: candidate
      - run: chmod +x candidate/Sudokura-*.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*.AppImage fedora44 skip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-fedora44-runtime
          path: linux-runtime-fedora44.txt

  windows:
    needs: resolve
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Expose setup-go executable to MSYS2
        shell: pwsh
        run: |
          $go = (Get-Command go -ErrorAction Stop).Source
          "SUDOKURA_GO=$go" >> $env:GITHUB_ENV
          & $go version
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-ttf-dejavu
            make zip unzip
      - name: Fetch pinned Inno Setup
        shell: pwsh
        run: ./scripts/fetch_innosetup.ps1
      - run: packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x86_64
          path: |
            Sudokura-*.zip
            SHA256SUMS-windows.txt
            inventory-windows.txt
            dependencies-windows.txt
            dependencies-windows-recursive.txt
            Sudokura-*-windows-x86_64-setup.exe
            artifact-manifest-windows.json
            build-provenance-windows.txt
            components-windows.txt

  macos:
    needs: resolve
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
      ARCH: arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf sdl2_mixer pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-arm64
          path: |
            Sudokura-*.dmg
            SHA256SUMS-macos-arm64.txt
            inventory-macos-arm64.txt
            dependencies-macos-arm64.txt
            architecture-macos-arm64.txt
            codesign-macos-arm64.txt
            components-macos-arm64.txt
            mach-o-audit-macos-arm64.json
            smoke-macos-arm64-*.txt
            dmg-verify-macos-arm64.txt
            size-comparison-macos-arm64.txt
            artifact-manifest-macos-arm64.json
            build-provenance-macos-arm64.txt

  checksums:
    needs: [linux, linux-ubuntu24, linux-fedora44, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - run: cat artifacts/SHA256SUMS-*.txt | sort -k2 > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checksums
          path: |
            artifacts/SHA256SUMS.txt
            artifacts/artifact-manifest-*.json
            artifacts/build-provenance-*.txt
