name: Preview Sudokura v1.1.0 packages
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to package without publishing
        required: true
        default: upgrade/v1.1.0
        type: string
permissions: {contents: read}
env: {VERSION: '1.1.0'}
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.ref }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.24.x', cache: false}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libfuse2 wget fonts-dejavu-core
      - run: make assets && make WERROR=-Werror test test-ui all
      - run: SDL_VIDEODRIVER=dummy SDL_RENDER_DRIVER=software SDL_RENDER_VSYNC=0 ./sudokura --render-screenshots ui-review
      - run: ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
      - run: wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy && chmod +x linuxdeploy
      - run: VERSION=$VERSION LINUXDEPLOY=$PWD/linuxdeploy packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@v7
        with: {name: linux-x86_64, path: "Sudokura-*.AppImage\nSHA256SUMS-linux.txt\ninventory-linux.txt\ndependencies-linux.txt"}
      - uses: actions/upload-artifact@v7
        with: {name: ui-review-screenshots, path: ui-review, compression-level: 9}
  windows:
    runs-on: windows-latest
    defaults: {run: {shell: 'msys2 {0}'}}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.ref }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.24.x', cache: false}
      - uses: msys2/setup-msys2@v2
        with: {msystem: MINGW64, update: true, install: 'mingw-w64-x86_64-gcc mingw-w64-x86_64-pkg-config mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf mingw-w64-x86_64-ntldd-git mingw-w64-x86_64-ttf-dejavu zip'}
      - run: VERSION=$VERSION packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@v7
        with: {name: windows-x86_64, path: "Sudokura-*.zip\nSHA256SUMS-windows.txt\ninventory-windows.txt\ndependencies-windows.txt"}
  macos:
    strategy: {fail-fast: false, matrix: {include: [{runner: macos-13, arch: x86_64}, {runner: macos-14, arch: arm64}]}}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: {ref: '${{ inputs.ref }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.24.x', cache: false}
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: VERSION=$VERSION ARCH=${{ matrix.arch }} packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@v7
        with: {name: 'macos-${{ matrix.arch }}', path: "Sudokura-*.zip\nSHA256SUMS-*.txt\ninventory-macos-*.txt\ndependencies-macos-*.txt\narchitecture-macos-*.txt"}
  checksums:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with: {path: artifacts, pattern: '*', merge-multiple: true}
      - run: cat artifacts/SHA256SUMS-*.txt | sort -k2 > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with: {name: checksums, path: artifacts/SHA256SUMS.txt}
