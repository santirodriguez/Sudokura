name: Bootstrap Sudokura v1.1.0 tag

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v1.1.0.yml'

permissions:
  contents: write
  actions: write

jobs:
  create-tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create immutable release tag at validated main commit
        env:
          EXPECTED_SHA: '7891a25bf22de9ac404fb42cb913ee7f341dc1c0'
          TAG: 'v1.1.0'
        run: |
          set -euo pipefail
          target='${{ github.event.before }}'
          test "$target" = "$EXPECTED_SHA"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi
          git tag "$TAG" "$target"
          git push origin "refs/tags/$TAG"

      - name: Dispatch draft release workflow on the tag
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            --data '{"ref":"v1.1.0"}'
