name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: sudokura-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUDOKURA_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  android-changes:
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/1.3.9' ||
      github.ref == 'refs/heads/release/1.4.0' ||
      github.ref == 'refs/heads/release/1.4.1' ||
      github.ref == 'refs/heads/store-prep/1.4-next' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'release/1.4.1') ||
      github.head_ref == 'release/1.3.9' ||
      github.head_ref == 'release/1.4.0' ||
      github.head_ref == 'release/1.4.1'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: paths
        name: Select Android build inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as stream:
              event = json.load(stream)
          base = (event.get('pull_request', {}).get('base', {}).get('sha')
                  if os.environ['GITHUB_EVENT_NAME'] == 'pull_request'
                  else event.get('before'))
          changed = None
          if (isinstance(base, str) and len(base) == 40 and
                  set(base) <= set('0123456789abcdef') and set(base) != {'0'}):
              try:
                  changed = subprocess.check_output([
                      'git', 'diff', '--name-only', '-z', base, 'HEAD'
                  ], stderr=subprocess.DEVNULL).decode('utf-8').split('\0')
              except subprocess.CalledProcessError:
                  pass
          prefixes = ('android/', 'src/', 'assets/audio/',
                      'assets/branding/source/', 'assets/flags/raster/')
          files = {'LICENSE', '.gitattributes', 'assets/flags/LICENSE-MIT.txt',
                   'Makefile', 'scripts/generate_assets.go',
                   'scripts/generate_assets.py', 'scripts/validate_assets.py',
                   '.github/workflows/ci.yml',
                   '.github/workflows/android-preview.yml'}
          # A missing/new-branch base must build rather than silently skip.
          build = changed is None or any(
              path.startswith(prefixes) or path in files for path in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'build={str(build).lower()}\n')
          PY

  android:
    needs: android-changes
    if: needs.android-changes.outputs.build == 'true'
    uses: ./.github/workflows/android-preview.yml

  # Feature and final pre-merge UI candidates need source-exact Android debug
  # builds, without passing release-signing secrets to these branches.
  android-ui-debug:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/feature/unified-ui' ||
       github.ref == 'refs/heads/release-prep/1.4.0-unified-ui')
    uses: ./.github/workflows/android-preview.yml
    with:
      source_commit: ${{ github.sha }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential binutils file desktop-file-utils pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev libdecor-0-plugin-1-cairo libfuse2 curl fonts-dejavu-core
      - run: make assets
      - run: python3 tests/test_flag_notice.py
      - name: Validate Android signing controls without credentials
        run: |
          python3 tests/test_signing_context.py
          python3 tests/test_signing_artifact.py
          python3 tests/test_signing_workflow.py
      - run: make WERROR=-Werror test test-ui
      - run: python3 scripts/validate_contrast.py
      - name: Run ASan and UBSan core tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_main.c src/game.c src/human.c src/geometry.c src/i18n.c -o tests/test_main_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_app.c src/app.c src/game.c src/human.c -o tests/test_app_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_clock.c src/app_clock.c src/app.c src/game.c src/human.c -o tests/test_clock_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_save_policy.c src/save_policy.c -o tests/test_save_policy_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_human.c src/human.c -o tests/test_human_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_session.c src/game.c src/human.c src/session.c src/store_io.c -o tests/test_session_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_profile.c src/profile.c src/session.c src/store_io.c src/game.c src/human.c -o tests/test_profile_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DSUDOKURA_STORE_TESTING -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_live_save.c src/profile.c src/save_policy.c src/session.c src/store_io.c src/game.c src/human.c -o tests/test_live_save_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_desktop.c src/desktop.c -o tests/test_desktop_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DSUDOKURA_URL_LAUNCHER_TESTING -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_url_launcher.c src/url_launcher.c -o tests/test_url_launcher_san
          ./tests/test_main_san
          ./tests/test_app_san
          ./tests/test_clock_san
          ./tests/test_save_policy_san
          ./tests/test_human_san
          ./tests/test_session_san
          make WERROR=-Werror tests/test_game_library_san
          ./tests/test_profile_san
          cc -I. -Isrc -O1 -g -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DSUDOKURA_STORE_TESTING -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_game_migration.c src/game_library.c src/game_library_codec.c \
            src/game_migration.c src/profile.c src/store_io.c src/seed.c \
            src/session.c src/game.c src/human.c -o tests/test_game_migration_san
          ./tests/test_game_library_san
          ./tests/test_game_migration_san
          ./tests/test_live_save_san
          ./tests/test_desktop_san
          ./tests/test_url_launcher_san
          rm -f tests/test_main_san tests/test_app_san tests/test_clock_san tests/test_game_library_san tests/test_game_migration_san tests/test_save_policy_san tests/test_human_san tests/test_session_san tests/test_profile_san tests/test_live_save_san tests/test_desktop_san tests/test_url_launcher_san
      - run: make WERROR=-Werror
      - name: Check incremental Saved Games rebuild
        run: |
          make -q sudokura
          make -n -W src/sudokura_sdl/games_ui.inc sudokura | grep -F 'src/sudokura_sdl.c'
      - name: Smoke without audio on the software renderer
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: sudokura-no-audio-device
          SDL_RENDER_DRIVER: software
          SDL_RENDER_VSYNC: '0'
        run: ./sudokura --smoke-test
      - run: ldd sudokura && size sudokura && du -h sudokura
      - name: Identify generator benchmark host
        run: |
          uname -a
          cc --version | head -1
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
      - name: Run generator quality corpus
        run: make WERROR=-Werror quality
      - name: Build and validate Linux candidate package
        env:
          SUDOKURA_ARTIFACT_KIND: ci-candidate
        run: |
          ./scripts/fetch_appimage_toolchain.sh
          LINUXDEPLOY=$PWD/linuxdeploy \
          APPIMAGETOOL=$PWD/appimagetool \
          APPIMAGE_RUNTIME=$PWD/appimage-runtime \
          packaging/ci/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase7-linux-candidate
          path: |
            Sudokura-*-Linux-x64.AppImage
            artifact-manifest-linux.json
            build-provenance-linux.txt
            inventory-linux.txt
            dependencies-linux-all.txt
            external-dependencies-linux.txt
            abi-linux.txt
            components-linux.txt
            SHA256SUMS-linux.txt
          retention-days: 7

  linux-ubuntu24:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: phase7-linux-candidate
          path: candidate
      - name: Install Ubuntu runtime validation dependencies
        run: |
          # Bound external apt/mirror stalls instead of trapping the entire CI.
          sudo timeout --signal=TERM --kill-after=10s 180s \
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
          # Weston has a large optional multimedia/VA/remote-desktop
          # dependency graph on Ubuntu 24.04. The runtime probe uses its
          # X11 backend and does not require those recommended add-ons.
          sudo timeout --signal=TERM --kill-after=10s 480s \
            env DEBIAN_FRONTEND=noninteractive apt-get \
              -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              install -y --no-install-recommends \
              binutils libfuse2t64 xvfb weston dbus-x11 gdb strace
      - run: chmod +x candidate/Sudokura-*-Linux-x64.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*-Linux-x64.AppImage ubuntu24 required
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: phase7-linux-ubuntu24-runtime
          path: linux-runtime-ubuntu24.txt
          retention-days: 7

  linux-fedora44:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf -y install git findutils coreutils binutils fuse-libs xorg-x11-server-Xvfb weston dbus-daemon gdb strace
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: phase7-linux-candidate
          path: candidate
      - run: chmod +x candidate/Sudokura-*-Linux-x64.AppImage && packaging/ci/validate-linux-runtime.sh candidate/Sudokura-*-Linux-x64.AppImage fedora44 skip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ always() }}
        with:
          name: phase7-linux-fedora44-runtime
          path: linux-runtime-fedora44.txt
          retention-days: 7

  macos:
    runs-on: macos-15
    env:
      SUDOKURA_SOURCE_COMMIT: ${{ github.sha }}
      ARCH: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: brew untap aws/tap || true; brew install sdl2 sdl2_ttf sdl2_mixer pkg-config; brew install --cask font-dejavu-sans
      - run: font=$(find "$HOME/Library/Fonts" /Library/Fonts -type f -name DejaVuSans.ttf -print -quit 2>/dev/null); test -n "$font"; test -f "$font"; echo "FONT=$font" >> "$GITHUB_ENV"
      - run: packaging/ci/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase7-macos-arm64
          path: |
            Sudokura-*-macOS-arm64.dmg
            SHA256SUMS-macos-arm64.txt
            artifact-manifest-macos-arm64.json
            build-provenance-macos-arm64.txt
            components-macos-arm64.txt
            inventory-macos-arm64.txt
            dependencies-macos-arm64.txt
            architecture-macos-arm64.txt
            codesign-macos-arm64.txt
            mach-o-audit-macos-arm64.json
            smoke-macos-arm64-*.txt
            dmg-verify-macos-arm64.txt
            size-comparison-macos-arm64.txt
          retention-days: 7

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Expose setup-go executable to MSYS2
        shell: pwsh
        run: |
          $go = (Get-Command go -ErrorAction Stop).Source
          "SUDOKURA_GO=$go" >> $env:GITHUB_ENV
          & $go version
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-ntldd-git
            mingw-w64-x86_64-ttf-dejavu
            make zip unzip
      - name: Fetch pinned Inno Setup
        shell: pwsh
        run: ./scripts/fetch_innosetup.ps1
      - name: Fetch pinned NSIS
        shell: pwsh
        run: ./scripts/fetch_nsis.ps1
      - name: Build and validate Windows package
        env:
          SUDOKURA_ARTIFACT_KIND: ci-candidate
        run: packaging/ci/package-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase8-windows-portable
          path: |
            Sudokura-*-Windows-x64-Portable.exe
            Sudokura-*-Windows-x64-Internal.zip
            Sudokura-*-Windows-x64-Setup.exe
            SHA256SUMS-windows.txt
            internal-zip-sha256-windows.txt
            artifact-manifest-windows.json
            build-provenance-windows.txt
            portable-benchmark-windows.txt
            inventory-windows.txt
            dependencies-windows.txt
            dependencies-windows-recursive.txt
            components-windows.txt
          retention-days: 7

  release-bundle:
    needs: [linux, linux-ubuntu24, linux-fedora44, windows, macos, android]
    if: >-
      always() && !cancelled() &&
      needs.linux.result == 'success' && needs['linux-ubuntu24'].result == 'success' &&
      needs['linux-fedora44'].result == 'success' && needs.windows.result == 'success' &&
      needs.macos.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped')
    env:
      INCLUDE_ANDROID: "false" # Only explicit release packaging can include a signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: phase7-linux-candidate
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: phase8-windows-portable
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: phase7-macos-arm64
          path: artifacts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: env.INCLUDE_ANDROID == 'true'
        with:
          name: sudokura-android-signed-github
          path: artifacts
      - name: Validate internal release candidate bundle
        run: |
          python3 tests/test_release_bundle.py
          python3 tests/test_android_release_manifest.py
          extra=()
          if [ "$INCLUDE_ANDROID" = true ]; then extra+=(--include-android); fi
          version=$(./scripts/version.sh)
          python3 scripts/release_bundle.py build \
            --artifacts-dir artifacts \
            --version "$version" \
            --source-commit "$GITHUB_SHA" "${extra[@]}"
          cat artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase9-release-bundle
          path: |
            artifacts/Sudokura-*-Windows-x64-Setup.exe
            artifacts/Sudokura-*-Windows-x64-Portable.exe
            artifacts/Sudokura-*-Linux-x64.AppImage
            artifacts/Sudokura-*-macOS-arm64.dmg
            artifacts/Sudokura-*-Android-arm64.apk
            artifacts/SHA256SUMS.txt
            artifacts/Sudokura-*-Build-Info.json
            artifacts/artifact-manifest-*.json
            artifacts/build-provenance-*.txt
          retention-days: 7

  ui-review:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-review]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev fonts-dejavu-core
      - run: make assets && make WERROR=-Werror all
      - run: python3 scripts/validate_contrast.py
      - name: Render Phase 5 diagnostic UI matrix
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_RENDER_VSYNC: '0'
        run: ./sudokura --render-screenshots ui-review
      - name: Validate screenshot matrix and validator regressions
        shell: bash
        run: |
          ./scripts/validate_screenshots.py ui-review | tee ui-review/VALIDATION.txt
          python3 tests/test_screenshot_validator.py ui-review
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: phase5-ui-review
          path: ui-review
          retention-days: 7

  desktop-benchmark:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop-benchmark]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libsdl2-mixer-dev fonts-dejavu-core time
      - run: |
          uname -a | tee desktop-host.txt
          cc --version | head -1 | tee -a desktop-host.txt
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' | tee -a desktop-host.txt || true
      - name: Build v1.3.9 and frozen v1.3.8 under identical toolchain
        shell: bash
        run: |
          set -euo pipefail
          make assets && make WERROR=-Werror all tests/test_deterministic_parity
          test "$(git rev-parse 'v1.3.8^{commit}')" = '4d2c8dbddbe906e5dd714a2f6691dd2760e98072'
          git worktree add --detach "$RUNNER_TEMP/sudokura-v138" 4d2c8dbddbe906e5dd714a2f6691dd2760e98072
          make -C "$RUNNER_TEMP/sudokura-v138" assets
          make -C "$RUNNER_TEMP/sudokura-v138" WERROR=-Werror all
          cc -I"$RUNNER_TEMP/sudokura-v138/src" -std=c11 -O2             -Wall -Wextra -Wpedantic -Werror             tests/test_deterministic_parity.c             "$RUNNER_TEMP/sudokura-v138/src/game.c"             "$RUNNER_TEMP/sudokura-v138/src/human.c"             -o "$RUNNER_TEMP/deterministic-v138"
      - name: Verify original/solution deterministic identity against v1.3.8
        shell: bash
        run: |
          set -euo pipefail
          for file in src/game.c src/game.h src/human.c src/human.h; do
            cmp "$file" "$RUNNER_TEMP/sudokura-v138/$file"
          done
          grep -Fq '  src/game.c' android/app/src/main/cpp/CMakeLists.txt
          grep -Fq '  src/human.c' android/app/src/main/cpp/CMakeLists.txt
          ./tests/test_deterministic_parity > deterministic-v139.txt
          "$RUNNER_TEMP/deterministic-v138" > deterministic-v138.txt
          diff -u deterministic-v138.txt deterministic-v139.txt
          test "$(wc -l < deterministic-v139.txt)" -eq 12
          printf 'Both versions match all 11 full original/solution fixtures.\n'
          printf 'Android build compiles the identical shared generator source files.\n'
          printf 'This does not substitute for executing fixture tests on Android ARM64.\n'
      - name: Measure three interleaved desktop samples per version
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          SDL_RENDER_DRIVER: software
          SDL_RENDER_VSYNC: '0'
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_compare_desktop_benchmarks.py
          old="$RUNNER_TEMP/sudokura-v138/sudokura"
          new="./sudokura"
          # Warm each executable before collecting comparable process samples.
          "$old" --desktop-benchmark > /dev/null
          "$new" --desktop-benchmark > /dev/null
          sample() {
            local version="$1" round="$2" executable="$3"
            local report="desktop-${version}-${round}.txt"
            "$executable" --desktop-benchmark > "$report"
            python3 scripts/validate_desktop_benchmark.py "$report"
          }
          # Alternate the order to reduce cache/scheduler drift.
          sample v138 1 "$old"
          sample v139 1 "$new"
          sample v139 2 "$new"
          sample v138 2 "$old"
          sample v138 3 "$old"
          sample v139 3 "$new"
          python3 scripts/compare_desktop_benchmarks.py \
            --baseline desktop-v138-1.txt desktop-v138-2.txt desktop-v138-3.txt \
            --candidate desktop-v139-1.txt desktop-v139-2.txt desktop-v139-3.txt \
            --output desktop-v138-v139-series.json
          /usr/bin/time -f 'wall_s=%e max_rss_kb=%M' \
            -o desktop-v138-smoke.txt "$old" --smoke-test
          /usr/bin/time -f 'wall_s=%e max_rss_kb=%M' \
            -o desktop-v139-smoke.txt "$new" --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v139-v138-desktop-comparison
          path: |
            desktop-host.txt
            desktop-v138-*.txt
            desktop-v139-*.txt
            desktop-v138-v139-series.json
            desktop-v138-smoke.txt
            desktop-v139-smoke.txt
            deterministic-v138.txt
            deterministic-v139.txt
          retention-days: 14

  android-runtime:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[android-runtime]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Prepare isolated 16 KiB emulator inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_emulator_runtime.py
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core libpulse0 libxkbfile1 libnss3 libx11-xcb1
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" "emulator" \
            "system-images;android-35;google_apis_ps16k;x86_64"
          mkdir -p android-runtime-output
          cp "$ANDROID_HOME/system-images/android-35/google_apis_ps16k/x86_64/source.properties" android-runtime-output/image-source.properties
          "$ANDROID_HOME/emulator/emulator" -version > android-runtime-output/emulator-version.txt
          python3 android/scripts/prepare_sources.py
          make assets
      - name: Build test-only prototype and native parity executable
        run: |
          bash android/gradlew --no-daemon :app:assemblePrototypeDebug \
            -PsudokuraEmulatorTest=true \
            -PsudokuraFont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            -PsudokuraFontLicense=/usr/share/doc/fonts-dejavu-core/copyright
          APK=android/app/build/outputs/apk/prototype/debug/app-prototype-debug.apk
          python3 android/scripts/audit_elf.py \
            "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            "$APK" --abi x86_64 > android-runtime-output/elf-audit.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" > android-runtime-output/zipalign.txt
          make tests/test_deterministic_parity WERROR=-Werror
          ./tests/test_deterministic_parity > android-runtime-output/parity-host.txt
      - name: Execute 16 KiB prototype runtime and deterministic parity
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/sudokura-runtime-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name sudokura-16k --device pixel_2 \
            --path "$ANDROID_AVD_HOME/sudokura-16k.avd" \
            --package "system-images;android-35;google_apis_ps16k;x86_64"
          test -s "$ANDROID_AVD_HOME/sudokura-16k.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' \
            "$ANDROID_AVD_HOME/sudokura-16k.avd" > "$ANDROID_AVD_HOME/sudokura-16k.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee android-runtime-output/avd-list.txt
          grep -Fxq sudokura-16k android-runtime-output/avd-list.txt
          "$ANDROID_HOME/emulator/emulator" -avd sudokura-16k -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 4096 -cores 2 \
            > android-runtime-output/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'timeout 15 adb -s emulator-5554 logcat -d > android-runtime-output/final-logcat.txt || true; kill "$emulator_pid" || true' EXIT
          boot_deadline=$((SECONDS + 180))
          until timeout 5 adb -s emulator-5554 get-state 2>/dev/null | grep -Fxq device; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || [ "$SECONDS" -ge "$boot_deadline" ]; then
              tail -60 android-runtime-output/emulator.log
              exit 1
            fi
            sleep 2
          done
          timeout 30 adb -s emulator-5554 root
          timeout 90 adb -s emulator-5554 wait-for-device
          python3 android/scripts/emulator_runtime.py --adb "$ANDROID_HOME/platform-tools/adb" \
            --apk android/app/build/outputs/apk/prototype/debug/app-prototype-debug.apk \
            --source "$GITHUB_SHA" --output android-runtime-output
          parity=$(find android/app -type f -name sudokura-parity -path '*/x86_64/*' -print -quit)
          test -n "$parity"
          test -x "$parity"
          adb -s emulator-5554 push "$parity" /data/local/tmp/sudokura-parity
          adb -s emulator-5554 shell chmod 700 /data/local/tmp/sudokura-parity
          adb -s emulator-5554 exec-out /data/local/tmp/sudokura-parity > android-runtime-output/parity-android.txt
          cmp android-runtime-output/parity-host.txt android-runtime-output/parity-android.txt
          printf 'x86_64_fixture_parity=PASS\nproduction_arm64_acceptance=NOT_ESTABLISHED\n' > android-runtime-output/parity-result.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-16k-runtime-diagnostics
          path: android-runtime-output/
          retention-days: 7
