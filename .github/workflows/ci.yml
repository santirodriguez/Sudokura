name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22.x'}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev
      - run: make assets
      - run: make WERROR=-Werror test
      - run: make WERROR=-Werror
      - run: ldd sudokura && size sudokura && du -h sudokura
