name: Finalize Sudokura v1.1.0 draft

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v1.1.0-draft.yml'

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark draft verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='pending' \
            -f context='release-draft-v1.1.0' \
            -f description='Checking draft, notes, tag and five assets' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Verify and update v1.1.0 draft
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_tag_sha='7891a25bf22de9ac404fb42cb913ee7f341dc1c0'
          actual_tag_sha=$(git rev-list -n 1 v1.1.0)
          echo "Tag commit: $actual_tag_sha"
          test "$actual_tag_sha" = "$expected_tag_sha"

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          releases = json.loads(Path('releases.json').read_text(encoding='utf-8'))
          matches = [release for release in releases if release.get('tag_name') == 'v1.1.0']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one v1.1.0 release, found {len(matches)}')

          release = matches[0]
          expected_assets = {
              'SHA256SUMS.txt',
              'Sudokura-v1.1.0-linux-x86_64.AppImage',
              'Sudokura-v1.1.0-windows-x86_64.zip',
              'Sudokura-v1.1.0-macos-x86_64-unsigned.zip',
              'Sudokura-v1.1.0-macos-arm64-unsigned.zip',
          }
          actual_assets = {asset['name'] for asset in release.get('assets', [])}

          print(f"Release ID: {release.get('id')}")
          print(f"Name: {release.get('name')}")
          print(f"Tag: {release.get('tag_name')}")
          print(f"Draft: {release.get('draft')}")
          print(f"Prerelease: {release.get('prerelease')}")
          print('Assets:')
          for name in sorted(actual_assets):
              print(f'  - {name}')

          if release.get('draft') is not True:
              raise SystemExit('v1.1.0 release is not a draft')
          if actual_assets != expected_assets:
              missing = sorted(expected_assets - actual_assets)
              extra = sorted(actual_assets - expected_assets)
              raise SystemExit(f'asset mismatch; missing={missing}; extra={extra}')

          Path('release-id.txt').write_text(str(release['id']), encoding='utf-8')
          PY

          release_id=$(cat release-id.txt)
          jq -n \
            --arg name 'Sudokura v1.1.0' \
            --rawfile body docs/RELEASE_NOTES_1.1.0.md \
            '{name: $name, body: $body, draft: true, prerelease: false}' \
            > release-patch.json

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input release-patch.json \
            > release-after.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('release-after.json').read_text(encoding='utf-8'))
          notes = Path('docs/RELEASE_NOTES_1.1.0.md').read_text(encoding='utf-8')
          expected_assets = {
              'SHA256SUMS.txt',
              'Sudokura-v1.1.0-linux-x86_64.AppImage',
              'Sudokura-v1.1.0-windows-x86_64.zip',
              'Sudokura-v1.1.0-macos-x86_64-unsigned.zip',
              'Sudokura-v1.1.0-macos-arm64-unsigned.zip',
          }
          actual_assets = {asset['name'] for asset in release.get('assets', [])}

          if release.get('name') != 'Sudokura v1.1.0':
              raise SystemExit('unexpected release name')
          if release.get('tag_name') != 'v1.1.0':
              raise SystemExit('unexpected release tag')
          if release.get('draft') is not True:
              raise SystemExit('release stopped being a draft')
          if release.get('prerelease') is not False:
              raise SystemExit('release is unexpectedly marked as prerelease')
          if actual_assets != expected_assets:
              raise SystemExit('assets changed while updating release notes')
          if (release.get('body') or '').rstrip('\n') != notes.rstrip('\n'):
              raise SystemExit('release body does not match current release notes')

          print('Final verification: draft=true, prerelease=false, five assets, notes synchronized')
          PY

      - name: Record draft verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = 'success' ]; then
            state='success'
            description='Draft verified: five assets, notes updated, unpublished'
          else
            state='failure'
            description='Draft verification failed; release remains unpublished'
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='release-draft-v1.1.0' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
