name: Finalize Sudokura v1.1.0 draft

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-v1.1.0-draft.yml'

permissions:
  contents: write
  statuses: write

jobs:
  verify-and-update-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify assets and update draft notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          status_url="repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          report_failure() {
            code=$?
            trap - ERR
            set +e
            gh api --method POST "$status_url" \
              -f state='failure' \
              -f context='release-draft-v1.1.0' \
              -f description='Draft verification or update failed' \
              -f target_url="$run_url" >/dev/null
            exit "$code"
          }
          trap report_failure ERR

          gh api --method POST "$status_url" \
            -f state='pending' \
            -f context='release-draft-v1.1.0' \
            -f description='Verifying draft release and five assets' \
            -f target_url="$run_url" >/dev/null

          expected_tag_sha='7891a25bf22de9ac404fb42cb913ee7f341dc1c0'
          actual_tag_sha=$(git rev-list -n 1 v1.1.0)
          test "$actual_tag_sha" = "$expected_tag_sha"

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          jq '[.[] | select(.tag_name == "v1.1.0")] | if length == 1 then .[0] else error("expected exactly one v1.1.0 release") end' \
            releases.json > release-before.json

          test "$(jq -r '.tag_name' release-before.json)" = 'v1.1.0'
          test "$(jq -r '.draft' release-before.json)" = 'true'
          test "$(jq -r '.prerelease' release-before.json)" = 'false'

          cat > expected-assets.txt <<'EOF'
          SHA256SUMS.txt
          Sudokura-v1.1.0-linux-x86_64.AppImage
          Sudokura-v1.1.0-macos-arm64-unsigned.zip
          Sudokura-v1.1.0-macos-x86_64-unsigned.zip
          Sudokura-v1.1.0-windows-x86_64.zip
          EOF
          jq -r '.assets[].name' release-before.json | sort > actual-assets-before.txt
          diff -u expected-assets.txt actual-assets-before.txt

          release_id=$(jq -r '.id' release-before.json)
          jq -n \
            --arg name 'Sudokura v1.1.0' \
            --rawfile body docs/RELEASE_NOTES_1.1.0.md \
            '{name: $name, body: $body, draft: true, prerelease: false}' \
            > release-patch.json

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --input release-patch.json \
            > release-after.json

          test "$(jq -r '.name' release-after.json)" = 'Sudokura v1.1.0'
          test "$(jq -r '.tag_name' release-after.json)" = 'v1.1.0'
          test "$(jq -r '.draft' release-after.json)" = 'true'
          test "$(jq -r '.prerelease' release-after.json)" = 'false'
          jq -r '.assets[].name' release-after.json | sort > actual-assets-after.txt
          diff -u expected-assets.txt actual-assets-after.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('release-after.json').read_text(encoding='utf-8'))
          expected = Path('docs/RELEASE_NOTES_1.1.0.md').read_text(encoding='utf-8')
          actual = release.get('body') or ''
          if actual.rstrip('\n') != expected.rstrip('\n'):
              raise SystemExit('release body does not match current release notes')
          PY

          trap - ERR
          gh api --method POST "$status_url" \
            -f state='success' \
            -f context='release-draft-v1.1.0' \
            -f description='Draft verified: five assets, notes updated, unpublished' \
            -f target_url="$run_url" >/dev/null
