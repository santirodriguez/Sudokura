name: Android v1.4.0 to v1.4.1 disposable in-place upgrade diagnostic

on:
  push:
    branches:
      - probe/sudokura-api30-ephemeral-upgrade
    paths:
      - .github/workflows/android-ephemeral-upgrade.yml
      - android/scripts/old_cold_reopen.py
      - android/scripts/ephemeral_upgrade.py
      - tests/test_old_cold_reopen.py
      - tests/test_ephemeral_upgrade.py

permissions:
  contents: read

jobs:
  original-version-cold-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout isolated diagnostic harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: probe
          persist-credentials: false
      - name: Checkout exact fixed v1.4.0 test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 3077dd6f0b803a523f7ab41d6203dfce9cfde978
          path: source140
          persist-credentials: false
      - name: Checkout exact integrated v1.4.1 test source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: c978dfcd6a9565d712940b67694f49f8505dd62c
          path: source141
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify exact source identity and offline fixtures before Android
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source140 rev-parse HEAD)" = 3077dd6f0b803a523f7ab41d6203dfce9cfde978
          test "$(git -C source141 rev-parse HEAD)" = c978dfcd6a9565d712940b67694f49f8505dd62c
          test -z "$(git -C source140 status --porcelain)"
          test -z "$(git -C source141 status --porcelain)"
          grep -Fxq '#define SUDOKURA_VERSION_ANDROID_CODE 1' source140/src/version.h
          grep -Fxq '#define SUDOKURA_VERSION_ANDROID_CODE 2' source141/src/version.h
          grep -Fxq '#define SUDOKURA_VERSION_PATCH 0' source140/src/version.h
          grep -Fxq '#define SUDOKURA_VERSION_PATCH 1' source141/src/version.h
          grep -Fq "applicationId 'org.cajapersonal.sudokura'" source140/android/app/build.gradle
          grep -Fq "applicationId 'org.cajapersonal.sudokura'" source141/android/app/build.gradle
          grep -Fq 'games_browser_load_keep_required(departing, same_attempt)' source140/src/sudokura_sdl/games_ui.inc
          grep -Fq 'games_browser_load_keep_required(departing, same_attempt)' source141/src/sudokura_sdl/games_ui.inc
          grep -Fq 'result->attempt_id = record->id;' source140/src/game_library.h
          grep -Fq 'result->attempt_id = record->id;' source141/src/game_library.h
          python3 -m py_compile probe/android/scripts/ephemeral_upgrade.py probe/android/scripts/old_cold_reopen.py
          python3 probe/tests/test_ephemeral_upgrade.py
          python3 probe/tests/test_old_cold_reopen.py
          python3 source140/android/scripts/test_prepare_sources.py
          python3 source141/android/scripts/test_prepare_sources.py
      - name: Install pinned source-build toolchains and Android 11 image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libpulse0 libxkbfile1 libnss3 libx11-xcb1
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod u+rw /dev/kvm
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" "emulator"
          IMAGE_PACKAGE='system-images;android-30;google_apis;x86_64'
          IMAGE_DIR="$ANDROID_HOME/system-images/android-30/google_apis/x86_64"
          IMAGE_LOG="$RUNNER_TEMP/sudokura-api30-sdkmanager.log"
          image_ready() {
            local props="$IMAGE_DIR/source.properties"
            test -s "$props" &&
              grep -Fxq 'AndroidVersion.ApiLevel=30' "$props" &&
              grep -Fxq 'SystemImage.TagId=google_apis' "$props" &&
              grep -Fxq 'SystemImage.Abi=x86_64' "$props" &&
              test -s "$IMAGE_DIR/system.img" &&
              test -s "$IMAGE_DIR/ramdisk.img"
          }
          for attempt in 1 2 3; do
            if "$SDKMANAGER" "$IMAGE_PACKAGE" >"$IMAGE_LOG" 2>&1; then
              cat "$IMAGE_LOG"
              if image_ready; then
                break
              fi
              echo 'Android 11 system image incomplete after SDK Manager success' >&2
            else
              cat "$IMAGE_LOG" >&2
            fi
            if ! grep -Fq 'Error on ZipFile unknown archive' "$IMAGE_LOG"; then
              echo 'SDK Manager failed without the allowed damaged-image signal' >&2
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'Android 11 system image failed after three attempts' >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          if ! image_ready; then
            echo 'Android 11 system image is missing or has the wrong identity' >&2
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -version
      - name: Build and audit both pinned unsigned Android APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upgrade-diagnostics
          for src in source140 source141; do
            source_log="$RUNNER_TEMP/sudokura-$src-source-prepare.log"
            for attempt in 1 2 3; do
              if python3 "$src/android/scripts/prepare_sources.py" >"$source_log" 2>&1; then
                cat "$source_log"
                break
              fi
              cat "$source_log" >&2
              if ! grep -Eq 'urllib\.error\.HTTPError: HTTP Error (429|502|503|504):' "$source_log"; then
                echo "Non-transient source preparation failure" >&2
                exit 1
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Source preparation exhausted allowed retries" >&2
                exit 1
              fi
              sleep "$((attempt * 5))"
            done
            make -C "$src" assets
            bash "$src/android/gradlew" --no-daemon --max-workers 2 \
              :app:assembleProductionRelease \
              -PsudokuraFont=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
              -PsudokuraFontLicense=/usr/share/doc/fonts-dejavu-core/copyright
            test -s "$src/android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk"
          done
          test "$(git -C source140 rev-parse HEAD)" = 3077dd6f0b803a523f7ab41d6203dfce9cfde978
          test "$(git -C source141 rev-parse HEAD)" = c978dfcd6a9565d712940b67694f49f8505dd62c
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          OLD_APK="source140/android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk"
          NEW_APK="source141/android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk"
          "$AAPT" dump badging "$OLD_APK" > upgrade-diagnostics/unsigned-v140.txt
          "$AAPT" dump badging "$NEW_APK" > upgrade-diagnostics/unsigned-v141.txt
          grep -Fq "package: name='org.cajapersonal.sudokura' versionCode='1' versionName='1.4.0'" upgrade-diagnostics/unsigned-v140.txt
          grep -Fq "package: name='org.cajapersonal.sudokura' versionCode='2' versionName='1.4.1'" upgrade-diagnostics/unsigned-v141.txt
          python3 source140/android/scripts/audit_apk.py "$AAPT" "$OLD_APK" \
            --variant release --require-unsigned > upgrade-diagnostics/unsigned-audit-v140.json
          python3 source141/android/scripts/audit_apk.py "$AAPT" "$NEW_APK" \
            --variant release --require-unsigned > upgrade-diagnostics/unsigned-audit-v141.json
          printf '%s\n' 'source_old=3077dd6f0b803a523f7ab41d6203dfce9cfde978' \
            'source_new=c978dfcd6a9565d712940b67694f49f8505dd62c' \
            'unsigned_audits=PASS' > upgrade-diagnostics/build-receipt.txt
      - name: Verify one disposable same-signer code1-to-code2 upgrade
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p upgrade-diagnostics
          export UPGRADE_TEST_PASS
          UPGRADE_TEST_PASS="$(openssl rand -hex 24)"
          KEY="$RUNNER_TEMP/sudokura-ephemeral-test.p12"
          OLD="$RUNNER_TEMP/sudokura-140-test-signed.apk"
          NEW="$RUNNER_TEMP/sudokura-141-test-signed.apk"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/sudokura-ephemeral-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          emulator_pid=''
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            timeout 18 adb -s emulator-5554 logcat -d -t 1100 > upgrade-diagnostics/final-logcat.txt 2>&1
            timeout 12 adb -s emulator-5554 exec-out screencap -p > upgrade-diagnostics/final-screen.png
            if [ -n "$emulator_pid" ]; then kill "$emulator_pid" 2>/dev/null || true; fi
            rm -f "$KEY" "$OLD" "$NEW"
            unset UPGRADE_TEST_PASS
            exit "$status"
          }
          trap cleanup EXIT
          keytool -genkeypair -noprompt -alias sudokura-ci-only \
            -dname "CN=Sudokura Disposable CI Test" \
            -keyalg RSA -keysize 3072 -validity 2 -storetype PKCS12 \
            -keystore "$KEY" -storepass:env UPGRADE_TEST_PASS -keypass:env UPGRADE_TEST_PASS \
            > upgrade-diagnostics/keytool.txt 2>&1
          SRC="source140/android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias sudokura-ci-only \
            --ks-pass env:UPGRADE_TEST_PASS --key-pass env:UPGRADE_TEST_PASS \
            --out "$OLD" "$SRC"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OLD" \
            > upgrade-diagnostics/test-cert-v140.txt
          SRC_NEW="source141/android/app/build/outputs/apk/production/release/app-production-release-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias sudokura-ci-only \
            --ks-pass env:UPGRADE_TEST_PASS --key-pass env:UPGRADE_TEST_PASS \
            --out "$NEW" "$SRC_NEW"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$NEW" \
            > upgrade-diagnostics/test-cert-v141.txt
          sha256sum "$OLD" "$NEW" > upgrade-diagnostics/test-apk-hashes.txt
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name sudokura-test-baseline --device pixel_2 \
            --path "$ANDROID_AVD_HOME/sudokura-test-baseline.avd" \
            --package "system-images;android-30;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd sudokura-test-baseline -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -memory 3072 -cores 2 \
            > upgrade-diagnostics/emulator.log 2>&1 &
          emulator_pid=$!
          deadline=$((SECONDS + 240))
          until timeout 7 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -Fxq 1; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || [ "$SECONDS" -ge "$deadline" ]; then
              echo "Android 11 emulator failed to boot"
              tail -80 upgrade-diagnostics/emulator.log
              exit 1
            fi
            sleep 4
          done
          python3 probe/android/scripts/ephemeral_upgrade.py \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            --old "$OLD" --new "$NEW" --output upgrade-diagnostics
      - name: Upload bounded upgrade evidence, never APK or keystore
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sudokura-v141-test-signer-upgrade-api30
          path: upgrade-diagnostics/
          if-no-files-found: warn
          retention-days: 7
